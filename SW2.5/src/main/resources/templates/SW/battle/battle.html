<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>SW2.5 戦闘シミュレーター</title>
	<style>
		body {
			background-color: #0d0d0d;
			color: #e0e0e0;
			font-family: 'Helvetica Neue', Arial, sans-serif;
			margin: 0;
			padding: 20px;
		}

		header {
			text-align: center;
			border-bottom: 2px solid #333;
			padding-bottom: 10px;
			margin-bottom: 20px;
		}

		h1 {
			margin: 0;
			color: #e63946;
			letter-spacing: 2px;
		}

		.battle-container {
			display: flex;
			gap: 20px;
			max-width: 1200px;
			margin: 0 auto;
		}

		.side-panel {
			flex: 1;
			background-color: #1a1a1a;
			border: 1px solid #333;
			border-radius: 8px;
			padding: 15px;
		}

		.side-panel.player-side {
			border-left: 4px solid #4ea8de;
		}

		.side-panel.enemy-side {
			border-left: 4px solid #e63946;
		}

		.side-title {
			font-size: 1.2rem;
			font-weight: bold;
			margin-top: 0;
			margin-bottom: 15px;
			padding-bottom: 5px;
			border-bottom: 1px solid #444;
		}

		.chara-card {
			background-color: #252525;
			border: 1px solid #444;
			border-radius: 6px;
			padding: 12px;
			margin-bottom: 12px;
		}

		.chara-card.dead {
			opacity: 0.4;
			filter: grayscale(100%);
		}

		.chara-card.acted {
			opacity: 0.6;
			border-color: #f4a261;
		}

		.chara-header {
			display: flex;
			justify-content: space-between;
			font-weight: bold;
			margin-bottom: 6px;
		}

		.chara-info {
			font-size: 0.85rem;
			color: #aaa;
			margin-bottom: 8px;
		}

		.hp-bar-container {
			background-color: #444;
			border-radius: 4px;
			height: 12px;
			width: 100%;
			overflow: hidden;
		}

		.hp-bar-fill {
			background-color: #2a9d8f;
			height: 100%;
			width: 100%;
			transition: width 0.3s ease;
		}

		.hp-bar-fill.danger {
			background-color: #e63946;
		}

		.action-panel {
			background-color: #1a1a1a;
			border: 1px solid #333;
			border-radius: 8px;
			padding: 20px;
			max-width: 1200px;
			margin: 20px auto 0 auto;
		}

		.action-form {
			display: flex;
			gap: 15px;
			align-items: center;
			justify-content: center;
			flex-wrap: wrap;
		}

		.form-group {
			display: flex;
			flex-direction: column;
			gap: 5px;
		}

		.form-group label {
			font-size: 0.85rem;
			color: #ccc;
		}

		select,
		input,
		button {
			padding: 8px 12px;
			background-color: #2a2a2a;
			color: #fff;
			border: 1px solid #555;
			border-radius: 4px;
			font-size: 0.95rem;
		}

		select:focus,
		input:focus {
			outline: none;
			border-color: #4ea8de;
		}

		.btn-attack {
			background-color: #e63946;
			color: #ffffff;
			border: none;
			font-weight: bold;
			font-size: 1rem;
			cursor: pointer;
			padding: 10px 25px;
			margin-top: 18px;
			transition: background 0.2s;
		}

		.btn-attack:hover {
			background-color: #d62828;
		}

		.log-panel {
			background-color: #111;
			border: 1px solid #333;
			border-radius: 8px;
			padding: 15px;
			max-width: 1200px;
			margin: 20px auto 0 auto;
			height: 180px;
			overflow-y: auto;
			font-family: monospace;
			font-size: 0.9rem;
			line-height: 1.5;
		}

		.log-entry {
			margin-bottom: 4px;
			border-bottom: 1px solid #222;
			padding-bottom: 2px;
		}
	</style>
</head>

<body>

	<header>
		<h1>SW2.5 BATTLE SIMULATOR</h1>
	</header>

	<div class="battle-container">

		<!-- 左カラム：プレイヤー陣営 -->
		<div class="side-panel player-side">
			<h2 class="side-title" style="color: #4ea8de;">🛡 プレイヤー陣営</h2>

			<div class="chara-card" th:each="player, stat : ${battleState.party}"
				th:classappend="${player.currentHp == 0} ? 'dead' : (${player.hasActed} ? 'acted' : '')">
				<div class="chara-header">
					<span th:text="${player.name}">ファイター</span>
					<span th:if="${player.hasActed}" style="color: #f4a261;">【行動済み】</span>
					<span>HP: <span th:text="${player.currentHp}">30</span> / <span
							th:text="${player.maxHp}">30</span></span>
				</div>
				<div class="chara-info">
					防護点: <span th:text="${player.defense}">4</span> |
					武器: <span th:text="${player.rightHandWeapon != null ? player.rightHandWeapon.name : '素手'}">大剣</span>
				</div>
				<div class="hp-bar-container">
					<div class="hp-bar-fill"
						th:style="'width: ' + (${player.currentHp} * 100 / ${player.maxHp}) + '%;'"></div>
				</div>
			</div>
		</div>

		<!-- 右カラム：モンスター陣営 -->
		<div class="side-panel enemy-side">
			<h2 class="side-title" style="color: #e63946;">⚔ モンスター陣営</h2>

			<div class="chara-card" th:each="enemy, stat : ${battleState.enemies}"
				th:classappend="${enemy.hp == 0} ? 'dead' : ''">
				<div class="chara-header">
					<span th:text="${enemy.name}">ゴブリンA</span>
					<span>HP: <span th:text="${enemy.hp}">15</span></span>
				</div>
				<div class="chara-info">
					防護点: <span th:text="${enemy.defense}">2</span> |
					打撃点: <span th:text="${enemy.attack}">4</span>
				</div>
				<div class="hp-bar-container">
					<div class="hp-bar-fill danger" th:style="'width: ' + (${enemy.hp} * 100 / 15) + '%;'"></div>
				</div>
			</div>
		</div>

	</div>

	<!-- コントロールパネル -->
	<div class="action-panel">
		<form th:action="@{/battle/attack}" method="post" class="action-form">

			<div class="form-group">
				<label for="attacker">攻撃者 (味方)</label>
				<select id="attacker" name="attackerIndex">
					<option th:each="player, stat : ${battleState.party}" th:value="${stat.index}"
						th:disabled="${player.hasActed or player.currentHp == 0}"
						th:text="${player.name} + (${player.hasActed} ? ' (行動済み)' : '')">
						ファイター
					</option>
				</select>
			</div>

			<div class="form-group">
				<label for="target">攻撃対象 (敵)</label>
				<select id="target" name="targetIndex">
					<option th:each="enemy, stat : ${battleState.enemies}" th:value="${stat.index}"
						th:disabled="${enemy.hp <= 0}"
						th:text="${enemy.name} + (${enemy.hp <= 0} ? ' (撃破済み)' : ' (HP:' + ${enemy.hp} + ')')">
						ゴブリンA
					</option>
				</select>
			</div>

			<div class="form-group">
				<label for="modifier">出目修正</label>
				<input type="number" id="modifier" name="modifier" value="0" style="width: 60px;">
			</div>

			<button type="submit" class="btn-attack">🎲 攻撃実行！</button>
		</form>
	</div>

	<!-- 下部：戦闘ログ -->
	<div class="log-panel" id="logPanel">
		<div class="log-entry" th:each="log : ${battleState.logs}">
			<span th:text="${log}">ログ表示エリア</span>
		</div>
	</div>

	<script>
		// ログパネルを一番上にスクロール（最新ログの表示）
		const logPanel = document.getElementById('logPanel');
		if (logPanel) {
			logPanel.scrollTop = 0;
		}
	</script>
</body>

</html>
