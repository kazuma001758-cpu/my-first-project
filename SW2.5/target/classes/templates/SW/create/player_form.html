<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>プレイヤー追加</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 8px; box-sizing: border-box; }
        .btn { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-secondary { background-color: #6c757d; }
    </style>
</head>
<body>
    <h2>🛡️ 新しいプレイヤーを追加</h2>
    
    <form th:action="@{/players}" th:object="${player}" method="post">
        <div class="form-group">
            <label for="name">プレイヤー名 / 職種:</label>
            <input type="text" id="name" th:field="*{name}" required placeholder="例: ファイター" />
        </div>
        <div class="form-group">
            <label for="hp">最大HP:</label>
            <!-- maxHp -> hp に変更 -->
            <input type="number" id="hp" th:field="*{hp}" required placeholder="例: 30" />
        </div>
        <div class="form-group">
            <label for="defense">防護点:</label>
            <input type="number" id="defense" th:field="*{defense}" required placeholder="例: 4" />
        </div>
        <div class="form-group">
            <label for="dexterity">命中力:</label>
            <input type="number" id="dexterity" th:field="*{dexterity}" required placeholder="例: 10" />
        </div>
        <div class="form-group">
            <label for="agility">回避力:</label>
            <input type="number" id="agility" th:field="*{agility}" required placeholder="例: 10" />
        </div>
        <div class="form-group">
            <label for="weapon">装備武器:</label>
            <!-- weaponId -> weapon.id に変更 -->
            <select id="weapon" th:field="*{weapon.id}">
                <option value="">-- 武器を選択 --</option>
                <option th:each="weapon : ${weapons}" 
                        th:value="${weapon.id}" 
                        th:text="${weapon.name + ' (威力:' + weapon.power + ')'}">
                </option>
            </select>
        </div>
        
        <button type="submit" class="btn">登録する</button>
        <a th:href="@{/SW/create/createmenu}" class="btn btn-secondary">戻る</a>
    </form>
</body>
</html>
