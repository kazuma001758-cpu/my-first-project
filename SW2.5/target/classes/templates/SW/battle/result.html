<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>VICTORY! - リザルト</title>
	<style>
		body {
			background-color: #0d0d0d;
			color: #e0e0e0;
			font-family: 'Helvetica Neue', Arial, sans-serif;
			text-align: center;
			padding: 50px 20px;
		}

		.result-box {
			background-color: #1a1a1a;
			border: 2px solid #f4a261;
			border-radius: 12px;
			max-width: 600px;
			margin: 0 auto;
			padding: 30px;
			box-shadow: 0 0 20px rgba(244, 162, 97, 0.3);
		}

		h1 {
			color: #f4a261;
			font-size: 2.5rem;
			margin-top: 0;
		}

		.reward-group {
			margin: 20px 0;
			text-align: left;
			background-color: #252525;
			padding: 15px;
			border-radius: 8px;
		}

		.reward-title {
			font-weight: bold;
			color: #4ea8de;
			margin-bottom: 8px;
		}

		ul {
			margin: 0;
			padding-left: 20px;
		}

		.btn-retry {
			display: inline-block;
			margin-top: 20px;
			padding: 12px 30px;
			background-color: #2a9d8f;
			color: white;
			text-decoration: none;
			font-weight: bold;
			border-radius: 6px;
		}

		.btn-retry:hover {
			background-color: #218376;
		}
	</style>
</head>

<body>

	<div class="result-box">
		<h1>⚔️ VICTORY! ⚔️</h1>
		<p>モンスターの群れを叩きのめした！</p>

		<div class="reward-group">
			<div class="reward-title">✨ 獲得経験値</div>
			<p style="font-size: 1.5rem; font-weight: bold; margin: 5px 0; color: #e9c46a;">
				<span th:text="${battleState.totalExp}">100</span> EXP
			</p>
		</div>

		<div class="reward-group">
			<div class="reward-title">💎 戦利品（ドロップ）</div>
			<ul>
				<li th:each="item : ${battleState.droppedItems}" th:text="${item}">
					ゴブリンA の 粗悪な武器 (50G)
				</li>
			</ul>
		</div>

		<!-- もう一度遊ぶためのリセットリンク（セッション再初期化用） -->
		<a th:href="@{/battle/reset}" class="btn-retry">もう一度戦う（リセット）</a>
	</div>

</body>

</html>
