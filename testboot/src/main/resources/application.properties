spring.application.name=testboot

# ====================================
# MariaDB 接続設定
# ====================================
# URL: [ホスト名]:[ポート番号]/[データベース名]
spring.datasource.url=jdbc:mariadb://localhost:3306/testboot_db
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ====================================
# Spring Data JPA / Hibernate 設定
# ====================================
# テーブルの自動作成・更新設定（none / validate / update / create / create-drop）
spring.jpa.hibernate.ddl-auto=update

# 実行されるSQLをコンソールに出力する設定（開発中に便利です）
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 方言（Dialect）の指定
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

system.proxy.host=172.25.100.11
system.proxy.port=80